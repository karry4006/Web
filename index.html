<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伺服器連線中斷 - Minecraft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="title">無法連線到伺服器</div>
        <div class="subtitle">我們正在努力修復...</div>

        <div class="progress-section" id="progressSection">
            <div class="progress-text" id="progressText">加載進度：0%</div>
            <div class="progress-track" aria-label="loading-progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="video-container" id="videoContainer">
            <video
                id="loadingVideo"
                playsinline
                webkit-playsinline
                x5-playsinline
                x5-video-player-type="h5"
                muted
                preload="auto"
                disablepictureinpicture
                controlslist="nofullscreen noremoteplayback"
            >
                <source src="pic/loading.mp4" type="video/mp4">
                您的瀏覽器不支持視頻播放
            </video>
        </div>

        <button class="button" id="reloadBtn">重新載入</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
